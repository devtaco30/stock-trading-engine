# U10 시험 전용 — 계좌 워커 1개(조정 모드 없음). 매칭 pod 주소 풀 두 개로 종목 slot별 담당을 찾아 보낸다.
transport:
  account-intake:
    channel: aeron:udp?endpoint=localhost:20040
  fill:
    channel: aeron:udp?endpoint=localhost:20060
matching-shard-routing:
  stock-slot-count: 64
  endpoints:
    - aeron:udp?endpoint=localhost:20020
    - aeron:udp?endpoint=localhost:20021
account:
  worker:
    archive-dir: /tmp/u10/account
    archive:
      control-channel: aeron:udp?endpoint=localhost:8010
account-worker:
  seed-accounts:
    - account-id: 90001
      balance: 100000000
      margin-rate: 0.40
    - account-id: 90002
      balance: 100000000
      margin-rate: 0.40
logging:
  level:
    # 거부 회신마다 수신 시각을 남겨 u10-flow.sh가 이동 중 표시 구간 안의 거부 건수를 직접 센다.
    com.flab.stocktradingengine.account.worker.messaging.AeronMatchingOrderSender: DEBUG
