# 부하 테스트 프로파일 — 공유 Postgres(9702) + Redis(호가창 스냅샷). 시드는 api가 로드.
# 기동: ./gradlew :matching-engine:bootRun --args='--spring.profiles.active=loadtest'
spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://localhost:9702/stock_trading
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: matching-engine
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flab.stocktradingengine.kafka.event"
        metadata.max.age.ms: 10000
    listener:
      ack-mode: manual_immediate

snowflake:
  node-id: 2
