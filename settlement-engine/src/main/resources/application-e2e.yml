# e2e 측정 프로파일 — 공유 Postgres(9702). 시드는 api가 로드.
# 기동: ./gradlew :settlement-engine:bootRun --args='--spring.profiles.active=e2e'
spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://localhost:9702/stock_trading
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: settlement-engine
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flab.stocktradingengine.kafka.event"
    listener:
      ack-mode: manual_immediate

snowflake:
  node-id: 3
