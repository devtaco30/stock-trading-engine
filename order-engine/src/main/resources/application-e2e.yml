# e2e 측정 프로파일 — 공유 Postgres(9702). 시드는 api가 로드하므로 여기선 sql.init 끔.
# 기동: ./gradlew :order-engine:bootRun --args='--spring.profiles.active=e2e'
spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://localhost:9702/stock_trading
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # 전용 컨슈머 그룹 + latest — 다른 프로파일(loadtest 등)과 group-id를 공유하면 오늘
      # 하루 쌓인 order-requests 백로그(수만 건)를 이 프로세스가 그대로 이어받아 소비한다.
      # 실측정 확인: group-id를 공유했을 때 lag=4620짜리 파티션을 재생하며 그 옛 메시지들의
      # requestedAt(몇 시간 전)으로 지연(now-requestedAt)을 계산해 히스토그램이 오염됨
      # (count=1731, p50이 수천 초로 튐 — 2026-09-16 실측 발견). 전용 그룹+latest로 격리해
      # 이 프로세스는 자신이 뜬 이후에 들어온 메시지만 본다.
      group-id: order-engine-e2e
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flab.stocktradingengine.kafka.event"
    listener:
      ack-mode: manual_immediate
      # order-requests 파티션 수만큼 컨슈머 스레드 → 계좌 분산 시 병렬 처리
      concurrency: 3

snowflake:
  node-id: 1
