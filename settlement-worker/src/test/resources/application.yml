# 테스트용 datasource. 공유 loadtest Postgres(9702) — Testcontainers 안 씀(Jack 확정).
# 사전 조건: docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d
spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://localhost:9702/stock_trading
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: settlement-worker
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flab.stocktradingengine.kafka.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    listener:
      ack-mode: manual_immediate
