# C7 부하 테스트 하네스 — v1 loadtest-seed.sql(계좌 1001~1050, 잔고 1e11, margin 1.00)과
# 같은 계좌 집합을 이 워커의 인메모리 AccountState에도 시드한다. api가 보는 Postgres 계좌와
# 이 워커가 아는 계좌가 같아야 주문이 ACCOUNT_NOT_FOUND 없이 접수된다.
# --spring.profiles.active=udp,loadtest로 udp 프로파일(transport 채널)과 함께 켠다 —
# udp 프로파일의 데모 계좌(90001/90002)는 이 계좌 목록이 같은 인덱스를 덮어써 대체된다.
account-worker:
  metrics:
    enabled: true
  seed-accounts:
