spring:
  main:
    web-application-type: none
  # account-disruptor → trading 의존이 runtime classpath에 postgresql 드라이버(Hikari 대상)를 끌고 온다
  # (trading 모듈은 JPA를 쓰지만 account-worker는 DB가 없다). 자동설정을 명시적으로 끈다.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: account-worker
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.flab.stocktradingengine.kafka.event"
    listener:
      ack-mode: manual_immediate
