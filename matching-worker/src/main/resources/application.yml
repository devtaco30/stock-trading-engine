spring:
  main:
    web-application-type: none
  # matching-disruptor → trading 의존이 runtime classpath에 postgresql 드라이버(Hikari 대상)를 끌고 온다
  # (trading 모듈은 JPA를 쓰지만 matching-worker는 DB가 없다). account-worker와 같은 이유로 끈다.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  # 최근 체결가(LTP) 기록용 Redis. 명령 타임아웃을 짧게 둬 응답 없는 Redis에서 기록 스레드가 오래 멈추지 않게 한다(매칭 스레드는 Redis에 닿지 않는다)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

snowflake:
  node-id: 4
