# 계좌 서버 StatefulSet(작업 3.3). pod 이름이 account-0이 되고 headless Service 덕에 account-0.account라는 고정 DNS 이름을 갖는다.
# 발신기는 주문을 account-0.account:20040으로, 매칭 서버는 체결을 account-0.account:20060으로 보낸다(Aeron UDP).
# 설정 파일은 ConfigMap account-config(account.yml = k8s/config/account.yml, seed.yml = 실행마다 만드는 시드)로 넣는다.
# 맥 시험(loadtest/s0b/mix.sh:122)의 명령줄 인자(지표 보고 켬, 결과 로그 ERROR, GC 로그)는 args와 JDK_JAVA_OPTIONS로 같게 준다.
# 자원 한도는 이번 변경에서 기능 확인용 임시 값이다(한계 측정 때 다시 정한다). 실행마다 파드 메모리 사용량을 결과의 pod-usage.log에 남긴다.
apiVersion: v1
kind: Service
metadata:
  name: account
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: account
  ports:
    - name: aeron-intake
      port: 20040
      protocol: UDP
    - name: aeron-fill
      port: 20060
      protocol: UDP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: account
spec:
  serviceName: account
  replicas: 1
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      nodeSelector:
        ste-role: server
      # 기동 순서 문(gate). 계좌 서버는 매칭 서버가 맵 토픽(matching-shard-map)을 만든 뒤에 떠야 한다. 먼저 뜨면
      # 「매칭 shard가 맵 토픽을 만든 뒤에 계좌 shard를 기동해야 합니다」로 기동이 실패하고 컨테이너가 재시작된다(2026-11-05 첫 실행에서 확인).
      # 맥(mix.sh:98~100)은 매칭 기동 로그를 본 뒤 계좌를 띄웠다. 여기서는 매칭 서버가 계좌 서버 DNS 이름(account-0.account)을 기다리므로
      # 계좌 파드가 먼저 있어야 하고, 그래서 파드는 만들되 앱은 이 init 컨테이너에서 멈춰 둔다.
      # k8s/run.sh가 매칭 기동 로그를 확인한 뒤 /gate/go 파일을 만들어 문을 연다. 이 파드가 새로 만들어지면 다시 열어 줘야 한다.
      initContainers:
        - name: wait-start-gate
          image: stock-trading-engine/account-worker:local
          imagePullPolicy: Never
          command: ["sh", "-c", "until [ -f /gate/go ]; do sleep 1; done"]
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          volumeMounts:
            - { name: gate, mountPath: /gate }
      containers:
        - name: account-worker
          image: stock-trading-engine/account-worker:local
          imagePullPolicy: Never
          args:
            - "--spring.config.additional-location=file:/config/account.yml,file:/config/seed.yml"
            - "--spring.kafka.bootstrap-servers=kafka-0.kafka:9092"
            - "--account-worker.metrics.enabled=true"
            - "--logging.level.com.flab.stocktradingengine.account.worker.listener.LoggingAccountResultListener=ERROR"
          env:
            # 계좌당 미체결 상한(ADR-040). 1000000은 상한 없는 비교용 값이고 운영 상한이 아니다(loadtest/u10/u10-account.yml과 같은 관례).
            - name: MAX_OPEN_ORDERS
              value: "1000000"
            - name: JDK_JAVA_OPTIONS
              value: "-Xms1g -Xmx1g -Xlog:gc*:file=/logs/gc-account.log:time,uptime"
          ports:
            - { containerPort: 20040, protocol: UDP }
            - { containerPort: 20060, protocol: UDP }
          # 메모리 = 힙 1Gi + /dev/shm 1Gi(아래 sizeLimit, 메모리 emptyDir이라 합산된다) + 힙 밖 512Mi.
          # 실측(2026-11-05, 초당 1,000건 60초, k8s/run.sh 결과 pod-usage.log): memory.current 최대 1,254MiB, /dev/shm 실제 사용 최대 125MB·파일 크기 합 최대 913MB(실행 3~5).
          resources:
            requests: { cpu: "1", memory: "2560Mi" }
            limits: { cpu: "2", memory: "2560Mi" }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: shm, mountPath: /dev/shm }
            - { name: archive, mountPath: /data }
            - { name: logs, mountPath: /logs }
      volumes:
        - name: gate
          emptyDir:
            sizeLimit: 1Mi
        - name: config
          configMap:
            name: account-config
        # Aeron 디렉터리(로그 버퍼). 컨테이너 기본 /dev/shm은 64MB라 모자랄 수 있다. 메모리 기반이라 사용량이 메모리 한도에 합산된다.
        # 크기(작업 3.1 실측): 60초 실행에서 실제 쓴 크기는 최대 125MB였지만 로그 버퍼 파일 크기 합은 최대 913MB였다(매칭 파드 재시작 뒤 버퍼가 하나 더 생긴 때).
        # 로그 버퍼는 term 3개를 돌아가며 쓰므로 실행이 길면 실제 사용이 파일 크기 합까지 올라간다. 그래서 파일 크기 합 + 여유로 정한다.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        # Aeron archive 녹화와 스냅샷. 파드와 함께 지워지고 회수하지 않는다.
        - name: archive
          emptyDir:
            sizeLimit: 2Gi
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
