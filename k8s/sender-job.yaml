# 발신기(U10Tool) Job 틀(작업 3.5). 실행 스크립트(k8s/run.sh)가 __NAME__과 __ARGS__(JSON 배열)를 채워 하위 명령마다 Job 하나를 만든다.
# 계좌·매칭 서버와 다른 노드(ste-role=load)에 둔다. 맥에서는 발신기가 서버와 같은 CPU를 썼다.
# U10Tool은 명령마다 내장 Aeron MediaDriver를 띄우므로(디렉터리는 /dev/shm 아래 임의 이름) /dev/shm을 메모리 emptyDir로 붙인다.
# 환경 변수 BULK_ACCOUNTS는 send-bulk가 읽는다(mix.sh:106과 같다).
apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: sender
    spec:
      restartPolicy: Never
      nodeSelector:
        ste-role: load
      containers:
        - name: sender
          image: stock-trading-engine/u10-sender:local
          imagePullPolicy: Never
          args: __ARGS__
          env:
            - name: BULK_ACCOUNTS
              value: "__BULK_ACCOUNTS__"
            - name: JDK_JAVA_OPTIONS
              value: "-Xms256m -Xmx512m"
          resources:
            requests: { cpu: "1", memory: "1Gi" }
            limits: { cpu: "2", memory: "1Gi" }
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
