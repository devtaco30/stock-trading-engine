# 부하 테스트 프로파일 — 4개 앱(api·order·matching·settlement)이 공유 Postgres(9702)를 바라본다.
# 인프라: docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d
# 기동:   ./gradlew :api:bootRun --args='--spring.profiles.active=loadtest'
# 시드(users·accounts)는 api만 로드하고, 엔진들은 sql.init을 끈다(중복 INSERT 방지).
spring:
  datasource:
    url: jdbc:postgresql://localhost:9702/stock_trading
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:stocks.sql, classpath:quotes.sql, classpath:loadtest-seed.sql
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

snowflake:
  node-id: 0
